name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: pip install -e ".[dev,infra]"
      - name: Ruff
        run: >-
          python -m ruff check
          smart_agent
          scripts/check_docs.py
          scripts/run_test_group.py
          scripts/career_e2e.py
          smart_agent/web/app.py
      - name: Compile Python sources
        run: python -m compileall -q smart_agent scripts tests
      - name: Check local documentation links
        run: python scripts/check_docs.py

  base-environment:
    name: Base environment - ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [core, code]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install without Career optional dependencies
        run: pip install -e ".[dev]"
      - name: Run ${{ matrix.group }} tests
        run: python scripts/run_test_group.py ${{ matrix.group }}

  career-environment:
    name: Career environment - ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [career, web, integration, optional_dependency]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Career and Web dependencies
        run: pip install -e ".[dev,career,web]"
      - name: Install Chromium
        if: matrix.group == 'career' || matrix.group == 'integration'
        run: python -m playwright install --with-deps chromium
      - name: Run ${{ matrix.group }} tests
        run: python scripts/run_test_group.py ${{ matrix.group }}
      - name: Run offline Career smoke test
        if: matrix.group == 'career'
        run: python scripts/career_e2e.py --workspace .tmp/ci-career-e2e --force

  security-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -e ".[dev,infra]"
      - name: Run deterministic review benchmark
        run: python scripts/run_core_benchmark.py
