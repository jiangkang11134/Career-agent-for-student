[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-agent"
version = "0.3.0"
description = "Domain-routed AI agent with Code and Career modules"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Smart Agent Contributors"},
]
keywords = ["ai", "coding-agent", "code-review", "docker", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jiangkang11134/smart-agent"
Repository = "https://github.com/jiangkang11134/smart-agent"
Documentation = "https://github.com/jiangkang11134/smart-agent/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]
evaluation = [
    "datasets>=4,<6",
    "ragas>=0.4.3,<1",
]
web = [
    "fastapi>=0.109.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.27.0",
]
career = [
    "chromadb>=1.0,<2",
    "qdrant-client>=1.12,<2",
    "ortools>=9.10,<9.11",
    "playwright>=1.48,<2",
    "pypdf>=6.20.0,<7",
    "python-docx>=1.1,<2",
]
infra = [
    "redis>=5,<6",
    "sqlalchemy>=2,<3",
    "pymysql>=1.1,<2",
    "alembic>=1.13,<2",
]
production = [
    "fastapi>=0.109.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.27.0",
    "redis>=5,<6",
    "sqlalchemy>=2,<3",
    "pymysql>=1.1,<2",
    "qdrant-client>=1.12,<2",
    "alembic>=1.13,<2",
]
ocr = [
    "pillow>=10,<13",
    "pymupdf>=1.24,<2",
    "pytesseract>=0.3.10,<1",
    "paddleocr>=2.7,<3",
]

[project.scripts]
smart-agent = "smart_agent.main:main"
smart-agent-headless = "smart_agent.headless:main"
smart-agent-web = "smart_agent.web.app:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["待清除", ".git", ".tmp", ".runtime", "artifacts", "竞赛文件"]
timeout = 30
markers = [
    "benchmark: deterministic local performance checks",
    "integration: cross-component or subprocess tests",
    "optional_dependency: tests requiring an optional package or external service",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
smart_agent = ["builtin_skills/*/SKILL.md"]


[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
]
ignore = [
    "E402",   # allow module-level imports (lazy init pattern)
    "E501",   # line too long
    "E731",   # allow lambda assignments
    "F401",   # allow unused imports (re-exports)
    "F821",   # allow undefined names (commented-code pattern)
    "F823",   # allow undefined local (commented-code pattern)
    "F841",   # allow unused variables (commented-code pattern)
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
exclude = [
    "build/",
    "benchmark/results",
]
